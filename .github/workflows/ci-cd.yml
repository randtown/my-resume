name: build push and deploy image

on:
  push: 
     branches: [main]
  pull_request:
     branches: [main] 

permissions:
  id-token: write
  contents: read

env:
   AWS_REGION: us-east-1
   AWS_ROLE: ${{ secrets.AWS_ACTION_ROLE }} # to pull role-to-assume for github action 
   ECR_REPO_NAME: dev1
   IMAGE_TAG: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest # github runner
    steps: # Are for the build 
      - name: clone repo
        uses: actions/checkout@v5
      - name: AWS creds config #   need aws creds to login
        uses: aws-actions/configure-aws-credentials@v5
        with: # input for action
          role-to-assume: ${{ env.AWS_ROLE }}   #Open ID Connect OIDC: some of our pipline have access key and secret key from AWS, and right now I am refactioring those pipeline to us OIDC in state.  So we are useing a role in AWS instead of generating a key that we are plucking from GitHub action.
          aws-region: ${{ env.AWS_REGION }}
      - name: loging to ecr
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login # the meta data for the task gets store in this id.  it a like a big variable that have multi things in here:  repository, url, region that was used to login

      # Scan repository filesystem before Docker build
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs" # Scans filesystem (repo  )
          scan-ref: "." # Examine the entire checked-out repo
          format: "table" # Output format (table, json, sarif )
          severity: "CRITICAL,HIGH"  # Only fail on critical/high
          exit-code: "0" # fail if vulnerabilities , change to 1 to fail if find error, change to 0 to succes
          ignore-unfixed: true  # Ignore unfixed vulnerabilites
  
  
  
      - name: Build and tag image
        id: build-and-push # alias to refer to later
        run: | # | is to run multiply command
            docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }} . 
            
      
      # Scan before push
      - name: Scan docker Image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # 1 mean fail and 0 means succes, keep at 0 just to test the pipeline
          ignore-unfixed: true
      - name: Push image to ecr
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}

      - name: Store image in github env
        run: echo "Image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV # storing in env just in case you need it leater (>> we are add not overriding )

  Deploy:
    runs-on: ubuntu-latest #not the same one as the first ubuntu-latest, the firest was trashed
    needs: build # wait for build job to be done before deployment
    steps:
       # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Pull image from ECR
      - name: Pull Docker image
        run: |
          docker pull ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}

      # 5. Scan Docker image with Trivy
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # 6. Render ECS task definition
      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: nginx
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}

      # 7. Deploy to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      
